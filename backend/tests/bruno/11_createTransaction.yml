info:
  name: 11_createTransaction
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "amount": "50.00",
        "occurred_at": "2026-08-09T14:57:00Z",
        "description": "Nesto",
        "account_id": "{{accountId}}",
        "category_id": "{{categoryId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.body;
        const status = res.status;
        const headers = res.headers;

        expect(status).to.equal(201);
        expect(res.headers['content-type']).to.include('application/json');

        expect(data).to.have.property('id');
        expect(data).to.have.property('amount');
        expect(data).to.have.property('created_at');
        expect(data).to.have.property('occured_at');
        expect(data).to.have.property('description');
        expect(data).to.have.property('account_id');
        expect(data).to.have.property('category_id');

        console.log('Transaction creation successful');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
