info:
  name: 14_updateTransaction
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{transactionId}}"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "amount": "500.550",
        "occurred_at": "2026-08-07T10:00:00Z"
        "account_id": "{{accountId}}",
        "category_id": "{{categoryId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.body;
        const status = res.status;
        const headers = res.headers;

        expect(status).to.equal(200);
        expect(res.headers['content-type']).to.include('application/json');

        expect(data).to.have.property('id');
        expect(data).to.have.property('amount');
        expect(data).to.have.property('created_at');
        expect(data).to.have.property('occurred_at');
        expect(data).to.have.property('description');
        expect(data).to.have.property('account_id');
        expect(data).to.have.property('category_id');

        console.log('Transaction update successful');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
