version: "2"
sql:
  - schema: "database/migrations"
    queries: "database/queries"
    engine: "postgresql"
    gen:
      go:
        out: "database/sqlc"
        overrides:
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"