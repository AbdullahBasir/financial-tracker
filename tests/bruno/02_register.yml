      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "weare@example.com",
        "password": "securePassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
