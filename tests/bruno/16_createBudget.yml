info:
  name: 16_createBudget
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/budgets"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "monthly_limit": "1000.00",
        "month": "2026-08",
        "category_id": "{{categoryId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.body;
        const status = res.status;
        const headers = res.headers;

        expect(status).to.equal(201);
        expect(res.headers['content-type']).to.include('application/json');

        expect(data).to.have.property('id');
        expect(data).to.have.property('created_at');
        expect(data).to.have.property('monthly_limit');
        expect(data).to.have.property('month');
        expect(data).to.have.property('user_id');
        expect(data).to.have.property('category_id');

        console.log('Budget creation successful');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
