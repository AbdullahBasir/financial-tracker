info:
  name: 17_getBudgets
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/budgets"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.body;
        const status = res.status;
        const headers = res.headers;

        expect(status).to.equal(200);
        expect(res.headers['content-type']).to.include('application/json');

        expect(data).to.be.an('array');
        expect(data.length).to.be.greaterThan(0);

        data.forEach((budget, index) => {
          expect(budget).to.have.property('id');
          expect(budget).to.have.property('created_at');
          expect(budget).to.have.property('monthly_limit');
          expect(budget).to.have.property('month');
          expect(budget).to.have.property('user_id');
          expect(budget).to.have.property('category_id');
        });

        console.log(`Account retrieval successful - ${data.length} budgets found`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
