info:
  name: 05_getAccounts
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.body;
        const status = res.status;
        const headers = res.headers;

        expect(status).to.equal(200);
        expect(res.headers['content-type']).to.include('application/json');

        expect(data).to.be.an('array');
        expect(data.length).to.be.greaterThan(0);

        data.forEach((account, index) => {
          expect(account).to.have.property('id');
          expect(account).to.have.property('name');
          expect(account).to.have.property('created_at');
          expect(account).to.have.property('starting_balance');
          expect(account).to.have.property('type');
          expect(account).to.have.property('user_id');
        });

        console.log(`Account retrieval successful - ${data.length} accounts found`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
